name: Nightly Run

# 毎晩自動実行されるワークフロー
on:
  schedule:
    # 毎日午前2時（UTC）に実行
    - cron: '0 2 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  nightly-tasks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run nightly tasks
        run: |
          python scripts/nightly_tasks.py

      - name: Upload results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: nightly-run-results
          path: |
            *.log
            reports/
          retention-days: 30
